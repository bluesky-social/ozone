name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  linting:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Yarn install
        run: yarn

      - name: Lint JavaScript files
        run: yarn eslint --ext .js .

      - name: Lint Next.js app
        run: yarn lint
