name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  testing:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Yarn install
        run: yarn install --immutable

      - name: Run tests
        run: yarn test
